<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doughnut Charts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    :root { --ink: #202a2d; --muted: #68777a; --line: #dbe3df; --paper: #fff; --ground: #f5f8f5; --green: #008326; --teal: #095e65; --ochre: #e7af00; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--ground); font-family: "DM Sans", sans-serif; letter-spacing: 0; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
    button:disabled { opacity: .48; cursor: not-allowed; }
    .shell { max-width: 1480px; padding: 0 28px; margin: auto; }
    header { background: var(--paper); border-bottom: 1px solid var(--line); }
    .topbar { min-height: 86px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .mark { width: 37px; height: 37px; border: 10px solid var(--ochre); border-right-color: var(--teal); border-bottom-color: var(--green); border-radius: 50%; flex: none; }
    h1 { font-size: 21px; margin: 0; font-weight: 700; }
    .caption { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
    .header-actions, .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .button { border: 1px solid var(--line); background: white; color: var(--ink); padding: 10px 14px; border-radius: 5px; font-weight: 600; font-size: 13px; white-space: nowrap; }
    .button:hover:not(:disabled) { border-color: var(--teal); }
    .button.primary { color: white; border-color: var(--teal); background: var(--teal); }
    .button.primary:hover:not(:disabled) { background: #074b50; }
    .file-name { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 230px; }
    main { padding-top: 30px !important; padding-bottom: 40px !important; }
    .intro { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 21px; }
    .eyebrow { margin: 0 0 6px; font: 600 11px "IBM Plex Mono", monospace; color: var(--teal); text-transform: uppercase; }
    h2 { margin: 0; font-size: 25px; line-height: 1.2; }
    .hint { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
    .status { font-size: 12px; color: var(--muted); min-height: 19px; text-align: right; }
    .status.error { color: #ae4233; }
    .workspace { display: grid; grid-template-columns: minmax(315px, 420px) minmax(0, 1fr); gap: 20px; align-items: start; }
    .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
    .panel-heading { padding: 18px 20px 15px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .panel-heading h3 { margin: 0; font-size: 16px; }
    .panel-note { color: var(--muted); font: 500 12px "IBM Plex Mono", monospace; }
    .palette-actions { display: flex; align-items: center; gap: 10px; }
    .reset-colors { border: 0; background: none; padding: 5px 0; color: var(--teal); font-size: 12px; font-weight: 700; white-space: nowrap; }
    .reset-colors:hover { text-decoration: underline; }
    .tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 12px; }
    .tab { padding: 14px 16px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); font-size: 13px; font-weight: 700; }
    .tab[aria-selected="true"] { color: var(--teal); border-color: var(--teal); }
    .table-wrap { overflow-x: auto; min-height: 320px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { color: var(--muted); font-size: 11px; text-align: left; font-weight: 700; background: #f8faf9; }
    th, td { padding: 11px 14px; border-bottom: 1px solid #edf0ee; }
    th:first-child, td:first-child { padding-left: 20px; }
    th:last-child, td:last-child { padding-right: 20px; }
    td:first-child { font-weight: 600; }
    .status-cell { display: flex; align-items: center; gap: 10px; }
    .color-input { width: 28px; height: 28px; flex: none; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; cursor: pointer; }
    .color-input::-webkit-color-swatch-wrapper { padding: 2px; }
    .color-input::-webkit-color-swatch { border: 0; border-radius: 2px; }
    .color-input::-moz-color-swatch { border: 0; border-radius: 2px; }
    .number { font-family: "IBM Plex Mono", monospace; text-align: right; white-space: nowrap; }
    .value-input { width: 76px; padding: 7px 8px; border: 1px solid #cad6d2; border-radius: 4px; text-align: right; background: white; }
    .value-input:focus { border-color: var(--teal); }
    .table-foot { padding: 15px 20px; display: flex; justify-content: space-between; background: #f8faf9; font-size: 13px; font-weight: 700; }
    .table-foot strong { font-family: "IBM Plex Mono", monospace; }
    .preview { padding: 20px; }
    .chart-wrap { width: 100%; overflow: auto; display: flex; justify-content: center; align-items: center; min-height: 360px; }
    canvas { display: block; max-width: 100%; height: auto !important; }
    .mobile-legend { display: none; }
    .exports { padding: 17px 20px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 14px; align-items: center; flex-wrap: wrap; }
    .empty { padding: 90px 24px; text-align: center; color: var(--muted); }
    .empty strong { display: block; color: var(--ink); margin-bottom: 8px; font-size: 16px; }
    .empty .button { margin-top: 18px; }
    [hidden] { display: none !important; }
    @media (max-width: 1000px) { .workspace { grid-template-columns: 1fr; } .table-wrap { min-height: 0; } }
    @media (max-width: 670px) { .shell { padding-left: 16px; padding-right: 16px; } .topbar { align-items: flex-start; padding-top: 16px; padding-bottom: 16px; flex-direction: column; gap: 14px; } .intro { align-items: flex-start; flex-direction: column; } .status { text-align: left; } .file-name { max-width: 170px; } .preview { padding: 8px; } .chart-wrap { min-height: 240px; } .mobile-legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 5px 12px 16px; font-size: 12px; } .mobile-legend span { display: flex; align-items: flex-start; gap: 7px; min-width: 0; overflow-wrap: anywhere; } .mobile-legend i { flex: none; width: 12px; height: 12px; margin-top: 2px; } .exports { align-items: stretch; } .actions { width: 100%; } .actions .button { flex: 1; } }
  </style>
</head>
<body>
  <header>
    <div class="shell topbar">
      <div class="brand"><span class="mark" aria-hidden="true"></span><div><h1>Doughnut Charts</h1><p class="caption">AMEA / EUAM / AUNZ</p></div></div>
      <div class="header-actions"><span class="file-name" id="file-name">Belum ada file</span><button class="button primary" id="upload" type="button">Pilih Excel</button><input id="file" type="file" accept=".xlsx" hidden></div>
    </div>
  </header>
  <main class="shell">
    <div class="intro"><div><p class="eyebrow">Workspace</p><h2>Progress per region</h2><p class="hint">FIXED = Close / total Adjusted Value</p></div><div id="status" class="status" role="status" aria-live="polite"></div></div>
    <div id="empty" class="panel empty"><strong>Belum ada data</strong><span>Pilih workbook Excel untuk mulai.</span><br><button class="button primary" id="empty-upload" type="button">Pilih Excel</button></div>
    <div id="workspace" class="workspace" hidden>
      <section class="panel" aria-label="Data per region"><div class="panel-heading"><h3>Adjusted Value</h3><div class="palette-actions"><span class="panel-note" id="row-count"></span><button class="reset-colors" id="reset-colors" type="button">Reset warna</button></div></div><div class="tabs" role="tablist" aria-label="Region" id="tabs"></div><div class="table-wrap"><table><thead><tr><th>Status</th><th class="number">Value</th><th class="number">Adjusted</th></tr></thead><tbody id="rows"></tbody></table></div><div class="table-foot"><span>Total adjusted</span><strong id="total">0</strong></div></section>
      <section class="panel" aria-label="Preview chart"><div class="panel-heading"><h3 id="chart-name">AMEA</h3><span class="panel-note" id="fixed-note"></span></div><div class="preview"><div class="chart-wrap"><canvas id="preview" width="960" height="560" role="img" aria-label="Doughnut chart"></canvas></div><div id="mobile-legend" class="mobile-legend"></div></div><div class="exports"><span class="panel-note">PNG / XLSX</span><div class="actions"><button class="button" id="excel" type="button">Unduh Excel</button><button class="button" id="single" type="button">Unduh PNG</button><button class="button primary" id="all" type="button">Unduh semua PNG</button></div></div></section>
    </div>
  </main>
  <script>
    const SHEETS = ["AMEA", "EUAM", "AUNZ"];
    const STATUS_COLORS = { "Backlog": "#808080", "Open": "#3c96bc", "Fix in Progress": "#e7af00", "Fix In Progress": "#e7af00", "Ready in UAT": "#27488b", "Passed in UAT": "#6cc080", "Failed in UAT": "#ffa396", "For Client Review": "#e4eafc", "Client Test": "#9ae2ca", "Close": "#6cc080", "Closed": "#6cc080" };
    const FALLBACK = ["#4c78a8", "#72b7b2", "#e45756", "#b279a2", "#54a24b", "#f58518"];
    const EXPORT_WIDTH = 945;
    const EXPORT_HEIGHT = 560;
    const PALETTE_KEY = "doughnut-chart-palette-v1";
    const $ = (id) => document.getElementById(id);
    function loadPalette() {
      try {
        const saved = JSON.parse(localStorage.getItem(PALETTE_KEY) || "{}");
        return Object.fromEntries(Object.entries(saved).filter(([key, color]) => key !== "__proto__" && /^#[0-9a-f]{6}$/i.test(color)));
      } catch { return {}; }
    }
    const state = { data: null, sheet: SHEETS[0], chart: null, palette: loadPalette() };
    function savePalette() {
      try { localStorage.setItem(PALETTE_KEY, JSON.stringify(state.palette)); }
      catch { setStatus("Warna berubah, tapi browser tidak bisa menyimpannya untuk kunjungan berikutnya.", true); }
    }
    const number = (value) => Number(value).toLocaleString("id-ID");
    const total = (rows) => rows.reduce((sum, row) => sum + row.adjusted, 0);
    const percentage = (part, whole) => whole ? Math.round(part / whole * 100) : 0;
    const fixed = (rows) => rows.filter((row) => row.status === "Close" || row.status === "Closed").reduce((sum, row) => sum + row.adjusted, 0);

    function setStatus(text, isError = false) {
      $("status").textContent = text;
      $("status").classList.toggle("error", isError);
    }

    function parseWorkbook(workbook) {
      const result = {};
      for (const sheet of SHEETS) {
        if (!workbook.Sheets[sheet]) throw new Error(`Sheet ${sheet} tidak ditemukan.`);
        const cells = XLSX.utils.sheet_to_json(workbook.Sheets[sheet], { header: 1, defval: null });
        const header = cells[0] || [];
        const adjustedIndex = String(header[2] || "").trim().toLowerCase() === "adjusted value" ? 2 : -1;
        result[sheet] = cells.flatMap((cell, index) => {
          if (index === 0 || cell[1] === null || cell[1] === "" || cell[1] === undefined) return [];
          const value = Number(cell[1]);
          if (!Number.isFinite(value)) return [];
          const status = String(cell[0] ?? "").trim();
          const rawAdjusted = adjustedIndex < 0 ? value : cell[adjustedIndex];
          const adjusted = Number(rawAdjusted);
          if (!status || !Number.isFinite(adjusted) || adjusted < 0 || value < 0) throw new Error(`Nilai tidak valid di sheet ${sheet}, baris ${index + 1}.`);
          return [{ status, value, adjusted }];
        });
        if (!result[sheet].length) throw new Error(`Tidak ada data numerik di sheet ${sheet}.`);
      }
      return result;
    }

    function activeStatuses() {
      const statuses = new Set();
      for (const sheet of SHEETS) for (const row of state.data[sheet]) if (row.value !== 0) statuses.add(row.status);
      return [...statuses];
    }

    function colors() {
      return Object.fromEntries(activeStatuses().map((status, index) => [status, state.palette[status === "Close" ? "Closed" : status] || STATUS_COLORS[status] || FALLBACK[index % FALLBACK.length]]));
    }

    const whiteBackground = {
      id: "whiteBackground",
      beforeDraw(chart) {
        const { ctx, canvas } = chart;
        ctx.save();
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
      }
    };

    const centerText = {
      id: "centerText",
      afterDraw(chart) {
        const rows = chart.options.plugins.centerText.rows;
        const { ctx, chartArea } = chart;
        const centerX = (chartArea.left + chartArea.right) / 2;
        const centerY = (chartArea.top + chartArea.bottom) / 2;
        ctx.save();
        ctx.fillStyle = "#008326";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = chart.options.plugins.centerText.compact ? "700 34px 'DM Sans', sans-serif" : chart.options.plugins.centerText.slide ? "700 64px 'DM Sans', sans-serif" : "700 46px 'DM Sans', sans-serif";
        ctx.fillText(`${percentage(fixed(rows), total(rows))}%`, centerX, centerY - 14);
        ctx.font = chart.options.plugins.centerText.compact ? "700 15px 'DM Sans', sans-serif" : chart.options.plugins.centerText.slide ? "700 30px 'DM Sans', sans-serif" : "700 21px 'DM Sans', sans-serif";
        ctx.fillText("FIXED", centerX, centerY + 34);
        ctx.restore();
      }
    };

    function makeChart(canvas, sheet, compact = false, slide = false) {
      const rows = state.data[sheet].filter((row) => activeStatuses().includes(row.status));
      const sum = total(rows);
      const palette = colors();
      return new Chart(canvas, {
        type: "doughnut",
        data: {
          labels: rows.map((row) => `${number(Math.trunc(row.adjusted))} ${row.status} (${percentage(row.adjusted, sum)}%)`),
          datasets: [{ data: rows.map((row) => row.adjusted), backgroundColor: rows.map((row) => palette[row.status]), borderColor: "#fff", borderWidth: 2, hoverOffset: 0 }]
        },
        plugins: [whiteBackground, centerText],
        options: {
          responsive: false, animation: false, cutout: "60%", layout: { padding: 20 },
          plugins: {
            centerText: { rows, compact, slide }, tooltip: { enabled: false },
            legend: { display: !compact, position: "right", onClick: () => {}, labels: { boxWidth: slide ? 30 : 22, boxHeight: slide ? 24 : 14, padding: slide ? 8 : 15, color: "#202a2d", font: { family: "DM Sans", size: slide ? 34 : 15 } } }
          }
        }
      });
    }

    function render() {
      const rows = state.data[state.sheet];
      $("tabs").replaceChildren(...SHEETS.map((sheet) => {
        const button = document.createElement("button");
        button.className = "tab";
        button.type = "button";
        button.role = "tab";
        button.textContent = sheet;
        button.setAttribute("aria-selected", String(sheet === state.sheet));
        button.addEventListener("click", () => { state.sheet = sheet; render(); });
        return button;
      }));
      $("rows").replaceChildren(...rows.map((row) => {
        const tr = document.createElement("tr");
        const status = document.createElement("td");
        const statusCell = document.createElement("div");
        statusCell.className = "status-cell";
        const picker = document.createElement("input");
        picker.className = "color-input";
        picker.type = "color";
        picker.value = colors()[row.status] || STATUS_COLORS[row.status] || "#4c78a8";
        picker.setAttribute("aria-label", `Warna ${row.status}`);
        picker.title = `Ubah warna ${row.status}`;
        picker.addEventListener("input", () => {
          const key = row.status === "Close" ? "Closed" : row.status;
          state.palette[key] = picker.value;
          savePalette();
          const palette = colors();
          $("rows").querySelectorAll(".color-input").forEach((other) => {
            if (other.dataset.statusKey === key) other.value = picker.value;
          });
          const shown = rows.filter((entry) => activeStatuses().includes(entry.status));
          if (state.chart) {
            state.chart.data.datasets[0].backgroundColor = shown.map((entry) => palette[entry.status]);
            state.chart.update("none");
          }
          $("mobile-legend").querySelectorAll("i").forEach((swatch, index) => {
            swatch.style.background = palette[shown[index].status];
          });
        });
        picker.dataset.statusKey = row.status === "Close" ? "Closed" : row.status;
        statusCell.append(picker, document.createTextNode(row.status));
        status.append(statusCell);
        const value = document.createElement("td");
        value.className = "number";
        value.textContent = number(row.value);
        const adjusted = document.createElement("td");
        adjusted.className = "number";
        const input = document.createElement("input");
        input.className = "value-input";
        input.type = "number";
        input.min = "0";
        input.step = "any";
        input.value = row.adjusted;
        input.setAttribute("aria-label", `Adjusted Value ${row.status}`);
        input.addEventListener("change", () => {
          const next = Number(input.value);
          if (input.value.trim() === "" || !Number.isFinite(next) || next < 0) {
            input.value = row.adjusted;
            setStatus("Adjusted Value harus angka minimal 0.", true);
            return;
          }
          row.adjusted = next;
          setStatus("Nilai diperbarui. Unduh Excel untuk menyimpan perubahan.");
          render();
        });
        adjusted.append(input);
        tr.append(status, value, adjusted);
        return tr;
      }));
      $("row-count").textContent = `${rows.length} status`;
      $("total").textContent = number(total(rows));
      $("chart-name").textContent = state.sheet;
      $("fixed-note").textContent = `${percentage(fixed(rows), total(rows))}% FIXED`;
      if (state.chart) state.chart.destroy();
      const compact = window.matchMedia("(max-width: 670px)").matches;
      const canvas = $("preview");
      canvas.width = compact ? Math.min(350, window.innerWidth - 48) : 960;
      canvas.height = compact ? canvas.width : 560;
      state.chart = makeChart(canvas, state.sheet, compact);
      const palette = colors();
      $("mobile-legend").replaceChildren(...rows.filter((row) => activeStatuses().includes(row.status)).map((row) => {
        const label = document.createElement("span");
        const swatch = document.createElement("i");
        swatch.style.background = palette[row.status];
        label.append(swatch, document.createTextNode(`${number(Math.trunc(row.adjusted))} ${row.status} (${percentage(row.adjusted, total(rows))}%)`));
        return label;
      }));
      $("preview").setAttribute("aria-label", `Chart ${state.sheet}, ${percentage(fixed(rows), total(rows))}% fixed`);
    }

    window.addEventListener("resize", () => { if (state.data) render(); });

    $("reset-colors").addEventListener("click", () => {
      state.palette = {};
      savePalette();
      render();
      setStatus("Warna dikembalikan ke default.");
    });

    function download(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    }

    function chartImage(sheet) {
      const canvas = document.createElement("canvas");
      canvas.width = EXPORT_WIDTH;
      canvas.height = EXPORT_HEIGHT;
      const chart = makeChart(canvas, sheet, false, true);
      const image = canvas.toDataURL("image/png");
      chart.destroy();
      return image;
    }

    function imageBlob(image) {
      const binary = atob(image.split(",")[1]);
      const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
      const view = new DataView(bytes.buffer);
      const resolution = new Uint8Array(21);
      const chunk = new DataView(resolution.buffer);
      chunk.setUint32(0, 9);
      resolution.set([112, 72, 89, 115], 4);
      chunk.setUint32(8, Math.round(300 / 0.0254));
      chunk.setUint32(12, Math.round(300 / 0.0254));
      resolution[16] = 1;
      let crc = -1;
      for (let index = 4; index < 17; index++) {
        crc ^= resolution[index];
        for (let bit = 0; bit < 8; bit++) crc = (crc >>> 1) ^ (crc & 1 ? 0xedb88320 : 0);
      }
      chunk.setUint32(17, (crc ^ -1) >>> 0);
      const afterHeader = 8 + 12 + view.getUint32(8);
      let offset = afterHeader;
      while (offset < bytes.length) {
        const length = view.getUint32(offset);
        const type = String.fromCharCode(...bytes.subarray(offset + 4, offset + 8));
        if (type === "pHYs") return new Blob([bytes.subarray(0, offset), resolution, bytes.subarray(offset + 12 + length)], { type: "image/png" });
        if (type === "IDAT") break;
        offset += 12 + length;
      }
      return new Blob([bytes.subarray(0, afterHeader), resolution, bytes.subarray(afterHeader)], { type: "image/png" });
    }

    $("upload").addEventListener("click", () => $("file").click());
    $("empty-upload").addEventListener("click", () => $("file").click());
    $("file").addEventListener("change", async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      try {
        if (!window.XLSX || !window.Chart || !window.JSZip) throw new Error("Library belum termuat. Periksa koneksi internet dan coba lagi.");
        const workbook = XLSX.read(await file.arrayBuffer(), { type: "array" });
        state.data = parseWorkbook(workbook);
        state.sheet = SHEETS[0];
        $("file-name").textContent = file.name;
        $("empty").hidden = true;
        $("workspace").hidden = false;
        render();
        setStatus("Excel berhasil dibuka.");
      } catch (error) { setStatus(error.message, true); }
      event.target.value = "";
    });

    $("excel").addEventListener("click", () => {
      const workbook = XLSX.utils.book_new();
      for (const sheet of SHEETS) {
        const rows = state.data[sheet];
        const data = [["Status", "Value", "Adjusted Value", "Label"], ...rows.map((row) => [row.status, row.value, row.adjusted, null])];
        const worksheet = XLSX.utils.aoa_to_sheet(data);
        for (let index = 0; index < rows.length; index++) {
          const row = index + 2;
          const entry = rows[index];
          worksheet[`D${row}`] = {
            t: "str",
            f: `TEXT(C${row},"0")&" "&A${row}&" ("&TEXT(IFERROR(C${row}/SUM($C$2:$C$${rows.length + 1}),0),"0%")&")"`,
            v: `${Math.round(entry.adjusted)} ${entry.status} (${percentage(entry.adjusted, total(rows))}%)`
          };
        }
        worksheet["!ref"] = `A1:D${rows.length + 1}`;
        worksheet["!cols"] = [{ wch: 25 }, { wch: 10 }, { wch: 16 }, { wch: 35 }];
        XLSX.utils.book_append_sheet(workbook, worksheet, sheet);
      }
      download(new Blob([XLSX.write(workbook, { bookType: "xlsx", type: "array" })], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), "manipulated.xlsx");
    });

    $("single").addEventListener("click", () => download(imageBlob(chartImage(state.sheet)), `${state.sheet}.png`));
    $("all").addEventListener("click", async () => {
      const button = $("all");
      button.disabled = true;
      try {
        const zip = new JSZip();
        const combined = document.createElement("canvas");
        combined.width = EXPORT_WIDTH * SHEETS.length;
        combined.height = EXPORT_HEIGHT;
        const context = combined.getContext("2d");
        context.fillStyle = "#fff";
        context.fillRect(0, 0, combined.width, combined.height);
        for (const [index, sheet] of SHEETS.entries()) {
          const image = chartImage(sheet);
          zip.file(`${sheet}.png`, imageBlob(image));
          const picture = new Image();
          picture.src = image;
          await picture.decode();
          context.drawImage(picture, index * EXPORT_WIDTH, 0);
        }
        zip.file("ALL.png", imageBlob(combined.toDataURL("image/png")));
        download(await zip.generateAsync({ type: "blob" }), "doughnut-charts.zip");
        setStatus("Empat PNG siap diunduh.");
      } catch (error) { setStatus(error.message, true); }
      finally { button.disabled = false; }
    });
  </script>
</body>
</html>
